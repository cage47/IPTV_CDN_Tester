<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Closed Circuit - Credential Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #060d1f;
      --surface:  #0a1428;
      --border:   #1a2744;
      --green:    #00d4ff;
      --green-dim:#00d4ff30;
      --amber:    #ffab00;
      --red:      #ff1744;
      --blue:     #7b8cff;
      --text:     #c9d1d9;
      --muted:    #4a5568;
      --mono:     'JetBrains Mono', monospace;
      --display:  'Syne', sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .app { max-width: 800px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ── Header ── */
    header { margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 24px; }
    .logo { font-family: var(--display); font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .logo span { color: var(--green); }
    .logo a { color: inherit; text-decoration: none; }
    .tagline { color: var(--muted); font-size: 11px; margin-top: 4px; letter-spacing: 0.08em; text-transform: uppercase; }
    .cursor { display: inline-block; width: 8px; height: 14px; background: var(--green); margin-left: 3px; vertical-align: middle; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 8px;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--green); }

    /* ── Type Tabs ── */
    .type-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .type-tab {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .type-tab:hover {
      border-color: var(--green);
      color: var(--text);
    }

    .type-tab.active {
      background: var(--green-dim);
      border-color: var(--green);
      color: var(--green);
    }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 28px; margin-bottom: 20px; }

    /* ── Form ── */
    .field { margin-bottom: 16px; }
    label { 
      display: block; 
      font-size: 10px; 
      letter-spacing: 0.1em; 
      text-transform: uppercase; 
      color: var(--muted); 
      margin-bottom: 6px; 
      font-weight: 500;
    }
    
    input {
      width: 100%; 
      background: var(--bg); 
      border: 1px solid var(--border);
      border-radius: 4px; 
      padding: 11px 14px; 
      color: var(--text);
      font-family: var(--mono); 
      font-size: 13px; 
      outline: none;
      transition: all 0.15s;
    }
    input:focus { 
      border-color: var(--green); 
      box-shadow: 0 0 0 3px var(--green-dim); 
    }
    input[type="password"] { letter-spacing: 0.1em; }
    input::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) { 
      .field-row { grid-template-columns: 1fr; } 
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; 
      align-items: center; 
      justify-content: center;
      gap: 8px;
      padding: 12px 28px; 
      border-radius: 6px; 
      border: none; 
      cursor: pointer;
      font-family: var(--mono); 
      font-size: 12px; 
      font-weight: 600;
      letter-spacing: 0.05em; 
      text-transform: uppercase; 
      transition: all 0.2s;
      width: 100%;
    }
    .btn-primary { 
      background: linear-gradient(90deg,#00d4ff,#c040fb); 
      color: #000; 
    }
    .btn-primary:hover:not(:disabled) { 
      background: linear-gradient(90deg,#40ffff,#d060ff); 
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
    }
    .btn-primary:disabled { 
      background: var(--muted); 
      color: var(--bg); 
      cursor: not-allowed; 
      opacity: 0.5; 
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    /* ── Results ── */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .result-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
    }

    .result-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      word-break: break-all;
    }

    .result-value.success { color: var(--green); }
    .result-value.warning { color: var(--amber); }
    .result-value.error { color: var(--red); }

    /* ── Status Card ── */
    .status-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .status-card.success {
      border-color: var(--green);
      background: linear-gradient(135deg, var(--surface), #001a1a);
    }

    .status-card.error {
      border-color: var(--red);
      background: linear-gradient(135deg, var(--surface), #1a0000);
    }

    .status-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .status-title {
      font-family: var(--display);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .status-card.success .status-title { color: var(--green); }
    .status-card.error .status-title { color: var(--red); }

    .status-message {
      color: var(--muted);
      font-size: 12px;
    }

    /* ── Info box ── */
    .info-box {
      background: #1a2744;
      border-left: 3px solid var(--blue);
      padding: 14px 16px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 24px;
    }

    .info-box strong {
      color: var(--green);
    }

    .hidden { display: none; }

    /* ── Loading ── */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <a href="/">The Closed <span>Circuit</span></a><span class="cursor"></span>
      </div>
      <div class="tagline">Credential Checker</div>
      <a href="/" class="nav-back">← Back to Tools</a>
    </header>

    <main>
      <!-- Type Selection -->
      <div class="type-tabs">
        <button class="type-tab active" data-type="xtream">Xtream</button>
        <button class="type-tab" data-type="stalker">Stalker (MAC)</button>
      </div>

      <!-- Input Card -->
      <div class="card">
        <div class="info-box">
          <strong>Secure Testing:</strong> All credential validation happens through a secure proxy. 
          Your credentials are never stored or logged.
        </div>

        <!-- Xtream Form -->
        <form id="xtreamForm">
          <div class="field">
            <label>Server URL</label>
            <input type="text" id="xtreamUrl" placeholder="http://example.com:8080" required />
          </div>

          <div class="field-row">
            <div class="field">
              <label>Username</label>
              <input type="text" id="xtreamUsername" placeholder="username" autocomplete="username" required />
            </div>

            <div class="field">
              <label>Password</label>
              <input type="password" id="xtreamPassword" placeholder="password" autocomplete="current-password" required />
            </div>
          </div>

          <div class="btn-group">
            <button type="submit" class="btn btn-primary" id="xtreamCheckBtn">
              <span>Check Credentials</span>
            </button>
          </div>
        </form>

        <!-- Stalker Form -->
        <form id="stalkerForm" class="hidden">
          <div class="field">
            <label>Server URL</label>
            <input type="text" id="stalkerUrl" placeholder="http://example.com/stalker_portal" required />
          </div>

          <div class="field">
            <label>MAC Address</label>
            <input type="text" id="stalkerMac" placeholder="00:1A:79:XX:XX:XX" pattern="^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$" required />
          </div>

          <div class="btn-group">
            <button type="submit" class="btn btn-primary" id="stalkerCheckBtn">
              <span>Check Credentials</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Results -->
      <div id="resultsContainer" class="hidden"></div>
    </main>
  </div>

<script>
// ─────────────────────────────────────────────
// Elements & State
// ─────────────────────────────────────────────
const typeTabs = document.querySelectorAll('.type-tab');
const xtreamForm = document.getElementById('xtreamForm');
const stalkerForm = document.getElementById('stalkerForm');
const resultsContainer = document.getElementById('resultsContainer');

let currentType = 'xtream';

// ─────────────────────────────────────────────
// Type Tab Switching
// ─────────────────────────────────────────────
typeTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const type = tab.dataset.type;
    
    // Update active state
    typeTabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    
    // Show correct form
    if (type === 'xtream') {
      xtreamForm.classList.remove('hidden');
      stalkerForm.classList.add('hidden');
    } else {
      xtreamForm.classList.add('hidden');
      stalkerForm.classList.remove('hidden');
    }
    
    // Clear results
    resultsContainer.classList.add('hidden');
    resultsContainer.innerHTML = '';
    
    currentType = type;
  });
});

// ─────────────────────────────────────────────
// Xtream Form Handler
// ─────────────────────────────────────────────
xtreamForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const url = document.getElementById('xtreamUrl').value.trim();
  const username = document.getElementById('xtreamUsername').value.trim();
  const password = document.getElementById('xtreamPassword').value.trim();
  
  await checkXtream(url, username, password);
});

// ─────────────────────────────────────────────
// Stalker Form Handler
// ─────────────────────────────────────────────
stalkerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const url = document.getElementById('stalkerUrl').value.trim();
  const mac = document.getElementById('stalkerMac').value.trim();
  
  await checkStalker(url, mac);
});

// ─────────────────────────────────────────────
// SSRF Protection
// ─────────────────────────────────────────────
function validateUrl(urlString) {
  let url;
  try {
    url = new URL(urlString);
  } catch (e) {
    return { valid: false, error: 'Invalid URL format' };
  }

  if (!['http:', 'https:'].includes(url.protocol)) {
    return { valid: false, error: 'Only HTTP/HTTPS allowed' };
  }

  const hostname = url.hostname.toLowerCase();
  const blockedPatterns = [
    'localhost', '127.', '0.0.0.0', '10.', '192.168.', '169.254.',
    '172.16.', '172.17.', '172.18.', '172.19.', '172.20.', '172.21.',
    '172.22.', '172.23.', '172.24.', '172.25.', '172.26.', '172.27.',
    '172.28.', '172.29.', '172.30.', '172.31.', '[::1]'
  ];

  if (blockedPatterns.some(p => hostname.includes(p))) {
    return { valid: false, error: 'Private/internal IPs blocked' };
  }

  if (hostname.endsWith('.local') || hostname.endsWith('.internal') || hostname.endsWith('.lan')) {
    return { valid: false, error: 'Internal domains blocked' };
  }

  return { valid: true, url };
}

// ─────────────────────────────────────────────
// Check Xtream Credentials
// ─────────────────────────────────────────────
async function checkXtream(serverUrl, username, password) {
  // Validate URL
  const urlCheck = validateUrl(serverUrl);
  if (!urlCheck.valid) {
    showError(urlCheck.error);
    return;
  }

  // Show loading
  showLoading();

  try {
    // Build API URL
    const apiUrl = new URL(serverUrl);
    apiUrl.pathname = '/player_api.php';
    apiUrl.searchParams.append('username', username);
    apiUrl.searchParams.append('password', password);

    // Make request via proxy
    const proxyUrl = '/api/test-proxy?url=' + encodeURIComponent(apiUrl.href);
    const response = await fetch(proxyUrl, { cache: 'no-store' });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }

    const data = await response.json();

    // Check if auth failed
    if (data.user_info && data.user_info.auth === 0) {
      showError('Invalid credentials');
      return;
    }

    // Show success with account info
    showXtreamSuccess(data, serverUrl);

  } catch (error) {
    showError(error.message);
  }
}

// ─────────────────────────────────────────────
// Check Stalker Credentials
// ─────────────────────────────────────────────
async function checkStalker(serverUrl, mac) {
  // Validate URL
  const urlCheck = validateUrl(serverUrl);
  if (!urlCheck.valid) {
    showError(urlCheck.error);
    return;
  }

  // Validate MAC format
  const macPattern = /^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$/;
  if (!macPattern.test(mac)) {
    showError('Invalid MAC address format');
    return;
  }

  // Show loading
  showLoading();

  try {
    // Build Stalker portal URL
    const apiUrl = new URL(serverUrl);
    if (!apiUrl.pathname.includes('stalker_portal')) {
      apiUrl.pathname = '/stalker_portal/server/load.php';
    }
    apiUrl.searchParams.append('type', 'account_info');
    apiUrl.searchParams.append('mac', mac);

    // Make request via proxy
    const proxyUrl = '/api/test-proxy?url=' + encodeURIComponent(apiUrl.href);
    const response = await fetch(proxyUrl, { 
      cache: 'no-store',
      headers: {
        'Accept': 'application/json'
      }
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }

    const data = await response.json();

    // Check response
    if (data.js && data.js.error) {
      showError(data.js.error);
      return;
    }

    // Show success
    showStalkerSuccess(data, serverUrl, mac);

  } catch (error) {
    showError(error.message);
  }
}

// ─────────────────────────────────────────────
// Display Functions
// ─────────────────────────────────────────────
function showLoading() {
  resultsContainer.classList.remove('hidden');
  resultsContainer.innerHTML = `
    <div class="status-card">
      <div class="status-icon"><div class="spinner"></div></div>
      <div class="status-title">Checking Credentials...</div>
      <div class="status-message">Please wait while we validate your account</div>
    </div>
  `;
}

function showError(message) {
  resultsContainer.classList.remove('hidden');
  resultsContainer.innerHTML = `
    <div class="status-card error">
      <div class="status-icon">❌</div>
      <div class="status-title">Validation Failed</div>
      <div class="status-message">${escHtml(message)}</div>
    </div>
  `;
}

function showXtreamSuccess(data, serverUrl) {
  const user = data.user_info || {};
  const server = data.server_info || {};
  
  const expDate = user.exp_date ? new Date(parseInt(user.exp_date) * 1000).toLocaleDateString() : 'Unknown';
  const isActive = user.status === 'Active' || user.status === 'active';
  const maxConns = user.max_connections || 'N/A';
  const activeConns = user.active_cons || '0';
  const timezone = server.timezone || 'Unknown';
  
  resultsContainer.classList.remove('hidden');
  resultsContainer.innerHTML = `
    <div class="status-card success">
      <div class="status-icon">✅</div>
      <div class="status-title">Credentials Valid</div>
      <div class="status-message">Account is ${isActive ? 'active' : 'inactive'}</div>
    </div>

    <div class="card">
      <div class="results-grid">
        <div class="result-item">
          <div class="result-label">Expiry Date</div>
          <div class="result-value ${isExpiringSoon(user.exp_date) ? 'warning' : ''}">${expDate}</div>
        </div>

        <div class="result-item">
          <div class="result-label">Max Connections</div>
          <div class="result-value">${maxConns}</div>
        </div>

        <div class="result-item">
          <div class="result-label">Active Connections</div>
          <div class="result-value ${parseInt(activeConns) >= parseInt(maxConns) ? 'warning' : ''}">${activeConns}</div>
        </div>

        <div class="result-item">
          <div class="result-label">Status</div>
          <div class="result-value ${isActive ? 'success' : 'error'}">${user.status || 'Unknown'}</div>
        </div>

        <div class="result-item">
          <div class="result-label">Server URL</div>
          <div class="result-value" style="font-size: 11px">${escHtml(serverUrl)}</div>
        </div>

        <div class="result-item">
          <div class="result-label">Timezone</div>
          <div class="result-value">${timezone}</div>
        </div>

        ${server.url ? `
        <div class="result-item">
          <div class="result-label">Real URL</div>
          <div class="result-value" style="font-size: 11px">${escHtml(server.url)}</div>
        </div>
        ` : ''}

        ${server.port ? `
        <div class="result-item">
          <div class="result-label">Port</div>
          <div class="result-value">${server.port}</div>
        </div>
        ` : ''}
      </div>
    </div>
  `;
}

function showStalkerSuccess(data, serverUrl, mac) {
  const account = data.js || {};
  
  resultsContainer.classList.remove('hidden');
  resultsContainer.innerHTML = `
    <div class="status-card success">
      <div class="status-icon">✅</div>
      <div class="status-title">MAC Valid</div>
      <div class="status-message">Stalker portal access confirmed</div>
    </div>

    <div class="card">
      <div class="results-grid">
        <div class="result-item">
          <div class="result-label">MAC Address</div>
          <div class="result-value success">${escHtml(mac)}</div>
        </div>

        <div class="result-item">
          <div class="result-label">Server URL</div>
          <div class="result-value" style="font-size: 11px">${escHtml(serverUrl)}</div>
        </div>

        ${account.phone ? `
        <div class="result-item">
          <div class="result-label">Account ID</div>
          <div class="result-value">${escHtml(account.phone)}</div>
        </div>
        ` : ''}

        ${account.tariff_plan ? `
        <div class="result-item">
          <div class="result-label">Plan</div>
          <div class="result-value">${escHtml(account.tariff_plan)}</div>
        </div>
        ` : ''}

        ${account.status ? `
        <div class="result-item">
          <div class="result-label">Status</div>
          <div class="result-value ${account.status == 1 ? 'success' : 'error'}">${account.status == 1 ? 'Active' : 'Inactive'}</div>
        </div>
        ` : ''}
      </div>
    </div>
  `;
}

// ─────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────
function isExpiringSoon(expTimestamp) {
  if (!expTimestamp) return false;
  const exp = new Date(parseInt(expTimestamp) * 1000);
  const now = new Date();
  const daysLeft = (exp - now) / (1000 * 60 * 60 * 24);
  return daysLeft < 7 && daysLeft > 0;
}

const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
</script>
</body>
</html>
