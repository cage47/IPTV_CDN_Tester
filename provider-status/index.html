<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Closed Circuit - Provider Status</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #060d1f;
      --surface:    #0a1428;
      --surface2:   #0d1a35;
      --border:     #1a2744;
      --border2:    #243352;
      --cyan:       #00d4ff;
      --cyan-dim:   #00d4ff22;
      --success:    #00e676;
      --success-dim:#00e67618;
      --amber:      #ffab00;
      --amber-dim:  #ffab0018;
      --red:        #ff1744;
      --red-dim:    #ff174418;
      --muted:      #4a5568;
      --text:       #c9d1d9;
      --text-bright:#e6edf3;
      --mono:       'JetBrains Mono', monospace;
      --display:    'Syne', sans-serif;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.5;
      min-height: 100%;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .app { max-width: 1000px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ── Header ── */
    header {
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
      flex-wrap: wrap;
    }
    .logo { font-family: var(--display); font-size: 24px; font-weight: 800; color: var(--text-bright); letter-spacing: -0.5px; }
    .logo span { color: var(--cyan); }
    .logo a { color: inherit; text-decoration: none; }
    .tagline { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
    .cursor { display: inline-block; width: 8px; height: 14px; background: var(--cyan); margin-left: 3px; vertical-align: middle; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .header-right { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .nav-back { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; }
    .nav-back:hover { color: var(--cyan); }

    /* ── Global banner ── */
    .global-banner {
      border-radius: 8px; padding: 18px 22px;
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 8px;
    }
    .banner-ok   { background: var(--success-dim); border: 1px solid #00e67635; }
    .banner-deg  { background: var(--amber-dim);   border: 1px solid #ffab0035; }
    .banner-down { background: var(--red-dim);     border: 1px solid #ff174435; }
    .banner-none { background: var(--surface);     border: 1px solid var(--border); }
    .banner-dot  { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .dot-ok   { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot-deg  { background: var(--amber);   box-shadow: 0 0 8px var(--amber); }
    .dot-down { background: var(--red);     box-shadow: 0 0 8px var(--red); }
    .dot-none { background: var(--muted); }
    .banner-title { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--text-bright); }
    .banner-meta  { margin-left: auto; font-size: 11px; color: var(--muted); text-align: right; line-height: 1.6; }

    /* ── Methodology note ── */
    .method-note {
      font-size: 11px; color: var(--muted); line-height: 1.7;
      padding: 10px 14px; margin-bottom: 28px;
      border-left: 2px solid var(--border2);
    }
    .method-note strong { color: var(--text); }

    /* ── Legend ── */
    .legend { display: flex; gap: 18px; margin-bottom: 22px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; }

    /* ── Provider cards ── */
    .provider-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 22px 24px; margin-bottom: 18px;
      transition: border-color 0.2s;
    }
    .provider-card:hover { border-color: var(--border2); }
    .provider-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
    }
    .provider-name { font-family: var(--display); font-size: 17px; font-weight: 800; color: var(--text-bright); }
    .provider-meta { margin-left: auto; font-size: 11px; color: var(--muted); }

    /* ── Status badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; }
    .badge-ok   { background: var(--success-dim); color: var(--success); border: 1px solid #00e67630; }
    .badge-ok   .badge-dot { background: var(--success); }
    .badge-deg  { background: var(--amber-dim);   color: var(--amber);   border: 1px solid #ffab0030; }
    .badge-deg  .badge-dot { background: var(--amber); }
    .badge-down { background: var(--red-dim);     color: var(--red);     border: 1px solid #ff174430; }
    .badge-down .badge-dot { background: var(--red); }

    /* ── Endpoint rows ── */
    .endpoints { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .endpoint { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }

    .endpoint-main {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; background: var(--bg);
      flex-wrap: wrap;
    }
    .ep-status { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; }
    .ep-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .ep-dot-ok   { background: var(--success); box-shadow: 0 0 5px var(--success); }
    .ep-dot-fail { background: var(--red);     box-shadow: 0 0 5px var(--red); }
    .ep-dot-muted { background: var(--muted); }
    .ep-label { color: var(--text-bright); }
    .ep-label-fail { color: var(--red); }
    .ep-num { color: var(--muted); font-size: 11px; margin-left: auto; }
    .ep-ms  { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .ep-ms span { color: var(--cyan); }

    .endpoint-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 7px 14px; background: var(--surface2);
      border-top: 1px solid var(--border);
      font-size: 11px;
    }
    .ep-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 4px; font-size: 10px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); letter-spacing: 0.03em;
    }
    .ep-chip-key { color: var(--muted); }
    .ep-chip-val { color: var(--text); }
    .ep-chip-active { border-color: #00e67630; }
    .ep-chip-active .ep-chip-val { color: var(--success); }
    .ep-chip-fail { border-color: #ff174430; }
    .ep-chip-fail .ep-chip-val { color: var(--red); }
    .ep-formats { display: flex; gap: 4px; margin-left: auto; }
    .fmt-tag {
      padding: 2px 6px; border-radius: 3px; font-size: 10px;
      background: var(--cyan-dim); color: var(--cyan);
      border: 1px solid #00d4ff25; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .ep-error {
      padding: 6px 14px;
      background: var(--red-dim); border-top: 1px solid #ff174425;
      font-size: 11px; color: var(--red);
    }

    /* ── Timeline ── */
    .timeline-section { margin-top: 16px; }
    .timeline-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 7px; }
    .timeline { display: flex; gap: 2px; height: 20px; align-items: stretch; }
    .t-bar { flex: 1; border-radius: 2px; min-width: 2px; position: relative; cursor: default; transition: opacity 0.15s; }
    .t-bar:hover { opacity: 0.75; }
    .t-ok   { background: var(--success); }
    .t-deg  { background: var(--amber); }
    .t-down { background: var(--red); }
    .t-none { background: #111827; }
    .t-bar[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
      background: #1a2744; color: var(--text); padding: 3px 7px; border-radius: 4px;
      font-size: 10px; white-space: nowrap; z-index: 10;
      border: 1px solid #2a3f5f; pointer-events: none;
    }
    .timeline-ends { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* ── Loading / empty ── */
    .loading-wrap { text-align: center; padding: 80px 20px; }
    .loading-spinner { width: 24px; height: 24px; border: 3px solid var(--cyan-dim); border-top-color: var(--cyan); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 12px; }
    .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
    .empty-title { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .empty-desc { font-size: 12px; line-height: 1.8; max-width: 400px; margin: 0 auto; }

    /* ── Footer ── */
    .footer { text-align: center; margin-top: 48px; font-size: 11px; color: var(--muted); line-height: 2; }
    .footer a { color: var(--cyan); }
  </style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <div class="logo"><a href="/">The Closed <span>Circuit</span></a><span class="cursor"></span></div>
      <div class="tagline">Provider Status Monitor</div>
      <a href="/" class="nav-back">← All Tools</a>
    </div>
    <div class="header-right">
      <div class="live-dot"></div>
      <span id="refresh-label">Loading…</span>
    </div>
  </header>

  <div id="content">
    <div class="loading-wrap">
      <div class="loading-spinner"></div>
      <div class="loading-text">Fetching provider status…</div>
    </div>
  </div>

  <div class="footer">
    Checks run hourly · API auth only — stream availability not tested ·
    <a href="https://github.com/cage47/IPTV_CDN_Tester" target="_blank">GitHub</a> ·
    <a href="https://discord.gg/wXAtrTddkV" target="_blank">Discord</a>
  </div>

</div>

<script>
const REFRESH_INTERVAL = 60_000;
const HISTORY_HOURS = 24;

// ─────────────────────────────────────────────
// Fetch
// ─────────────────────────────────────────────
async function fetchStatus() {
  const [currentRes, historyRes] = await Promise.all([
    fetch('/api/status?type=current'),
    fetch(`/api/status?type=history&limit=${HISTORY_HOURS}`),
  ]);
  const current = await currentRes.json();
  const history = await historyRes.json();
  return { current, history };
}

// ─────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────
function render({ current, history }) {
  const container = document.getElementById('content');

  if (!current.providers || current.providers.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-title">No Status Data Yet</div>
        <div class="empty-desc">
          The status monitor hasn't run its first check yet.
          Checks run automatically every hour — check back soon.
        </div>
      </div>
    `;
    document.getElementById('refresh-label').textContent = 'Awaiting first check';
    return;
  }

  // ── Global status from auth results ──
  let totalOk = 0, totalEndpoints = 0;
  current.providers.forEach(p => {
    p.dns.forEach(d => {
      totalEndpoints++;
      if (d.authOk) totalOk++;
    });
  });

  const ratio = totalEndpoints > 0 ? totalOk / totalEndpoints : 0;
  let bannerClass, dotClass, bannerTitle;
  if (ratio >= 1)    { bannerClass = 'banner-ok';   dotClass = 'dot-ok';   bannerTitle = 'All Systems Operational'; }
  else if (ratio > 0){ bannerClass = 'banner-deg';  dotClass = 'dot-deg';  bannerTitle = 'Partial Degradation Detected'; }
  else if (totalEndpoints > 0) { bannerClass = 'banner-down'; dotClass = 'dot-down'; bannerTitle = 'All Providers Unreachable'; }
  else               { bannerClass = 'banner-none'; dotClass = 'dot-none'; bannerTitle = 'Awaiting First Check'; }

  const lastChecked = current.lastChecked ? timeAgo(current.lastChecked) : 'never';
  document.getElementById('refresh-label').textContent = `Auto-refresh every 60s · Last check: ${lastChecked}`;

  let html = '';

  html += `
    <div class="global-banner ${bannerClass}">
      <div class="banner-dot ${dotClass}"></div>
      <div class="banner-title">${bannerTitle}</div>
      <div class="banner-meta">${totalOk} / ${totalEndpoints} endpoints authenticated · Updated ${lastChecked}</div>
    </div>
    <div class="method-note">
      <strong>What this checks:</strong> Panel API connectivity and account authentication for each provider endpoint.
      Stream availability is not tested. A provider showing <strong style="color:var(--success)">Online</strong> means its API is reachable and credentials are valid.
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div> API Online</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> Auth Failed</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--muted)"></div> Unreachable / DNS Failed</div>
    </div>
  `;

  current.providers.forEach(provider => {
    const okCount = provider.dns.filter(d => d.authOk).length;
    const total = provider.dns.length;
    const pRatio = total > 0 ? okCount / total : 0;

    let badgeClass, badgeText;
    if (pRatio >= 1)    { badgeClass = 'badge-ok';   badgeText = 'Operational'; }
    else if (pRatio > 0){ badgeClass = 'badge-deg';  badgeText = 'Degraded'; }
    else                { badgeClass = 'badge-down'; badgeText = 'Down'; }

    html += `<div class="provider-card">`;
    html += `
      <div class="provider-header">
        <div class="provider-name">${esc(provider.name)}</div>
        <span class="badge ${badgeClass}"><span class="badge-dot"></span>${badgeText}</span>
        <div class="provider-meta">${okCount} / ${total} endpoint${total !== 1 ? 's' : ''} OK</div>
      </div>
      <div class="endpoints">
    `;

    provider.dns.forEach(d => {
      const ok = d.authOk;
      const msText = d.responseMs != null
        ? `<span class="ep-ms"><span>${d.responseMs.toLocaleString()}</span> ms</span>`
        : '';

      // Status row
      let dotCls, labelCls, labelText;
      if (!d.dnsResolves) {
        dotCls = 'ep-dot-muted'; labelCls = 'ep-label-fail'; labelText = 'DNS Failed';
      } else if (ok) {
        dotCls = 'ep-dot-ok'; labelCls = 'ep-label'; labelText = 'Panel Online';
      } else {
        dotCls = 'ep-dot-fail'; labelCls = 'ep-label-fail'; labelText = 'Auth Failed';
      }

      html += `
        <div class="endpoint">
          <div class="endpoint-main">
            <div class="ep-status">
              <div class="ep-dot ${dotCls}"></div>
              <span class="${labelCls}">${labelText}</span>
            </div>
            <span class="ep-num">Endpoint ${d.endpoint}</span>
            ${msText}
          </div>
      `;

      // Meta row — only show if we got a real response
      if (d.dnsResolves) {
        const acct = d.account;
        html += `<div class="endpoint-meta">`;

        if (acct) {
          const statusVal = acct.status || 'Active';
          const chipCls = statusVal.toLowerCase() === 'active' ? 'ep-chip-active' : 'ep-chip-fail';
          html += `
            <div class="ep-chip ${chipCls}">
              <span class="ep-chip-key">Account</span>
              <span class="ep-chip-val">${esc(capitalize(statusVal))}</span>
            </div>
          `;
          if (acct.maxConnections != null) {
            html += `
              <div class="ep-chip">
                <span class="ep-chip-key">Connections</span>
                <span class="ep-chip-val">${acct.maxConnections} max</span>
              </div>
            `;
          }
          if (acct.formats && acct.formats.length > 0) {
            html += `<div class="ep-formats">`;
            acct.formats.forEach(f => {
              html += `<span class="fmt-tag">${esc(f.toUpperCase())}</span>`;
            });
            html += `</div>`;
          }
        } else if (!ok) {
          // Auth failed — no account data
          html += `
            <div class="ep-chip ep-chip-fail">
              <span class="ep-chip-key">Account</span>
              <span class="ep-chip-val">Error</span>
            </div>
          `;
        }

        html += `</div>`;
      }

      // Error row
      if (d.authError) {
        html += `<div class="ep-error">${esc(d.authError)}</div>`;
      }

      html += `</div>`; // endpoint
    });

    html += `</div>`; // endpoints

    // ── Timeline ──
    const provHistory = getProviderHistory(provider.id, history.history || []);
    if (provHistory.length > 0) {
      const padded = padTimeline(provHistory, HISTORY_HOURS);
      html += `
        <div class="timeline-section">
          <div class="timeline-label">Uptime — Last 24 hours</div>
          <div class="timeline">
      `;
      padded.forEach(entry => {
        let cls, tip;
        if (!entry) {
          cls = 't-none'; tip = 'No data';
        } else {
          const r = entry.total > 0 ? entry.ok / entry.total : 0;
          if (r >= 1)    { cls = 't-ok';   tip = 'All endpoints OK'; }
          else if (r > 0){ cls = 't-deg';  tip = 'Partial failure'; }
          else           { cls = 't-down'; tip = 'All endpoints down'; }
          if (entry.timestamp) {
            const d = new Date(entry.timestamp);
            tip += ` · ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
          }
        }
        html += `<div class="t-bar ${cls}" data-tip="${esc(tip)}"></div>`;
      });
      html += `
          </div>
          <div class="timeline-ends"><span>24h ago</span><span>Now</span></div>
        </div>
      `;
    }

    html += `</div>`; // provider-card
  });

  container.innerHTML = html;
}

// ─────────────────────────────────────────────
// History helpers
// ─────────────────────────────────────────────
function getProviderHistory(providerId, history) {
  return history.map(entry => {
    const prov = entry.providers.find(p => p.id === providerId);
    if (!prov) return null;
    let ok = 0, total = 0;
    prov.dns.forEach(d => {
      total++;
      if (d.authOk) ok++;
    });
    return { timestamp: entry.timestamp, ok, total };
  }).filter(Boolean).reverse();
}

function padTimeline(data, slots) {
  if (data.length >= slots) return data.slice(-slots);
  return [...new Array(slots - data.length).fill(null), ...data];
}

// ─────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────
function timeAgo(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ${mins % 60}m ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();

// ─────────────────────────────────────────────
// Init + auto-refresh
// ─────────────────────────────────────────────
async function init() {
  try {
    const data = await fetchStatus();
    render(data);
  } catch (e) {
    console.error('Failed to fetch status:', e);
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="empty-title">Connection Error</div>
        <div class="empty-desc">Could not fetch status data. Will retry automatically.</div>
      </div>
    `;
  }
}

init();
setInterval(init, REFRESH_INTERVAL);
</script>
</body>
</html>
