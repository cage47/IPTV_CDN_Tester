<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Closed Circuit - Provider Status</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #060d1f;
      --surface:  #0a1428;
      --border:   #1a2744;
      --green:    #00d4ff;
      --green-dim:#00d4ff30;
      --amber:    #ffab00;
      --red:      #ff1744;
      --blue:     #7b8cff;
      --text:     #c9d1d9;
      --muted:    #4a5568;
      --mono:     'JetBrains Mono', monospace;
      --display:  'Syne', sans-serif;
      --success:  #00e676;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .app { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ── Header ── */
    header { margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 24px; }
    .header-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .logo { font-family: var(--display); font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .logo span { color: var(--green); }
    .logo a { color: inherit; text-decoration: none; }
    .tagline { color: var(--muted); font-size: 11px; margin-top: 4px; letter-spacing: 0.08em; text-transform: uppercase; }
    .cursor { display: inline-block; width: 8px; height: 14px; background: var(--green); margin-left: 3px; vertical-align: middle; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .nav-back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 8px; transition: color 0.2s; }
    .nav-back:hover { color: var(--green); }
    .spacer { flex: 1; }
    .logo-gradient { font-family: var(--display); font-size: 16px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg, #00d4ff, #c040fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; display: inline; }

    /* ── Global status banner ── */
    .global-banner {
      border-radius: 8px; padding: 20px 24px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .global-banner-ok { background: #00e67610; border: 1px solid #00e67640; }
    .global-banner-degraded { background: #ffab0010; border: 1px solid #ffab0040; }
    .global-banner-down { background: #ff174410; border: 1px solid #ff174440; }
    .global-banner-unknown { background: var(--surface); border: 1px solid var(--border); }
    .global-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .global-dot-ok { background: var(--success); box-shadow: 0 0 10px var(--success); }
    .global-dot-degraded { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
    .global-dot-down { background: var(--red); box-shadow: 0 0 10px var(--red); }
    .global-dot-unknown { background: var(--muted); }
    .global-text { font-family: var(--display); font-size: 16px; font-weight: 700; color: #fff; }
    .global-sub { font-size: 11px; color: var(--muted); margin-left: auto; }

    /* ── Auto-refresh indicator ── */
    .refresh-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-size: 11px; color: var(--muted); }
    .refresh-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── Provider cards ── */
    .provider-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 24px; margin-bottom: 20px; transition: border-color 0.3s;
    }
    .provider-card:hover { border-color: #2a3f5f; }
    .provider-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
    .provider-name { font-family: var(--display); font-size: 18px; font-weight: 800; color: #fff; }
    .provider-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-online { background: #00e67615; color: var(--success); border: 1px solid #00e67640; }
    .badge-degraded { background: #ffab0015; color: var(--amber); border: 1px solid #ffab0040; }
    .badge-blocked { background: #ff174415; color: var(--red); border: 1px solid #ff174440; }
    .badge-down { background: #4a556815; color: var(--muted); border: 1px solid var(--border); }

    /* ── DNS section within provider ── */
    .dns-section { margin-bottom: 16px; }
    .dns-header {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px 6px 0 0;
      font-size: 12px; flex-wrap: wrap;
    }
    .dns-host { color: #fff; font-weight: 500; }
    .dns-checks { display: flex; gap: 3px; margin-left: auto; }
    .dns-check-dot {
      width: 8px; height: 8px; border-radius: 2px; transition: background 0.3s;
      title: attr(data-tip);
    }
    .dns-check-ok { background: var(--success); }
    .dns-check-warn { background: var(--amber); }
    .dns-check-fail { background: var(--red); }
    .dns-check-none { background: #1a2744; }

    /* ── Channel results grid ── */
    .channel-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1px;
      background: var(--border); border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 6px 6px; overflow: hidden;
    }
    .ch-cell {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: var(--bg); font-size: 11px; min-width: 0;
    }
    .ch-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .ch-dot-online { background: var(--success); box-shadow: 0 0 4px var(--success); }
    .ch-dot-blocked { background: var(--red); box-shadow: 0 0 4px var(--red); }
    .ch-dot-black { background: var(--amber); box-shadow: 0 0 4px var(--amber); }
    .ch-dot-error { background: var(--muted); }
    .ch-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
    .ch-status { font-size: 10px; color: var(--muted); flex-shrink: 0; }

    /* ── Uptime timeline ── */
    .timeline-section { margin-top: 16px; }
    .timeline-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .timeline { display: flex; gap: 2px; height: 24px; align-items: stretch; }
    .timeline-bar {
      flex: 1; border-radius: 2px; min-width: 2px; position: relative;
      cursor: default; transition: opacity 0.15s;
    }
    .timeline-bar:hover { opacity: 0.8; }
    .timeline-bar-ok { background: var(--success); }
    .timeline-bar-degraded { background: var(--amber); }
    .timeline-bar-down { background: var(--red); }
    .timeline-bar-none { background: #111827; }
    .timeline-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* ── Tooltip ── */
    .timeline-bar[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      background: #1a2744; color: var(--text); padding: 4px 8px; border-radius: 4px;
      font-size: 10px; white-space: nowrap; z-index: 10; pointer-events: none;
      border: 1px solid #2a3f5f;
    }

    /* ── Loading state ── */
    .loading-wrap { text-align: center; padding: 80px 20px; }
    .loading-spinner { width: 24px; height: 24px; border: 3px solid var(--green-dim); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 12px; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .empty-desc { font-size: 12px; line-height: 1.8; max-width: 400px; margin: 0 auto; }

    /* ── Footer note ── */
    .footer-note { text-align: center; margin-top: 40px; font-size: 11px; color: var(--muted); line-height: 1.8; }
    .footer-note a { color: var(--green); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }

    /* ── Legend ── */
    .legend { display: flex; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  </style>
</head>
<body>
<div class="app">

  <header>
    <div class="header-row">
      <div>
        <div class="logo"><a href="/">The Closed <span>Circuit</span></a><span class="cursor"></span></div>
        <div class="tagline">Provider Status Monitor</div>
        <a href="/" class="nav-back">← All Tools</a>
      </div>
      <div class="spacer"></div>
      <span class="logo-gradient">📡 Live Status</span>
    </div>
  </header>

  <div id="content">
    <div class="loading-wrap">
      <div class="loading-spinner"></div>
      <div class="loading-text">Fetching provider status…</div>
    </div>
  </div>

  <div class="footer-note">
    Automated checks run every hour · Data retained for 7 days ·
    <a href="https://github.com/cage47/IPTV_CDN_Tester" target="_blank">GitHub</a> ·
    <a href="https://discord.gg/wXAtrTddkV" target="_blank">Discord</a>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// Config
// ─────────────────────────────────────────────
const REFRESH_INTERVAL = 60_000; // 60s
const HISTORY_HOURS = 24;

// ─────────────────────────────────────────────
// Fetch data
// ─────────────────────────────────────────────
async function fetchStatus() {
  const [currentRes, historyRes] = await Promise.all([
    fetch('/api/status?type=current'),
    fetch(`/api/status?type=history&limit=${HISTORY_HOURS}`),
  ]);
  const current = await currentRes.json();
  const history = await historyRes.json();
  return { current, history };
}

// ─────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────
function render({ current, history }) {
  const container = document.getElementById('content');

  if (!current.providers || current.providers.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📡</div>
        <div class="empty-title">No Status Data Yet</div>
        <div class="empty-desc">
          The status monitor hasn't run its first check yet.
          Checks run automatically every hour — check back soon.
        </div>
      </div>
    `;
    return;
  }

  // ── Calculate global status ──
  let totalOnline = 0, totalChecks = 0, totalBlocked = 0;
  current.providers.forEach(p => {
    p.dns.forEach(d => {
      d.channels.forEach(c => {
        totalChecks++;
        if (c.status === 'online') totalOnline++;
        if (c.status === 'blocked') totalBlocked++;
      });
    });
  });

  const healthPct = totalChecks > 0 ? (totalOnline / totalChecks * 100) : 0;
  let globalClass, dotClass, globalText;
  if (healthPct >= 90) {
    globalClass = 'global-banner-ok'; dotClass = 'global-dot-ok';
    globalText = 'All Systems Operational';
  } else if (healthPct >= 50) {
    globalClass = 'global-banner-degraded'; dotClass = 'global-dot-degraded';
    globalText = 'Partial Degradation Detected';
  } else if (totalChecks > 0) {
    globalClass = 'global-banner-down'; dotClass = 'global-dot-down';
    globalText = 'Major Outage Detected';
  } else {
    globalClass = 'global-banner-unknown'; dotClass = 'global-dot-unknown';
    globalText = 'Awaiting First Check';
  }

  const lastChecked = current.lastChecked ? timeAgo(current.lastChecked) : 'never';

  let html = '';

  // ── Global banner ──
  html += `
    <div class="global-banner ${globalClass}">
      <div class="global-dot ${dotClass}"></div>
      <div class="global-text">${globalText}</div>
      <div class="global-sub">${totalOnline}/${totalChecks} streams healthy · Updated ${lastChecked}</div>
    </div>
  `;

  // ── Refresh bar ──
  html += `
    <div class="refresh-bar">
      <div class="refresh-dot"></div>
      <span>Auto-refreshes every 60s · Last check: ${lastChecked}</span>
    </div>
  `;

  // ── Legend ──
  html += `
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div> Online</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> CF Blocked</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div> Black Screen</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--muted)"></div> Down / Error</div>
    </div>
  `;

  // ── Provider cards ──
  current.providers.forEach(provider => {
    // Overall provider status
    let provOnline = 0, provTotal = 0, provBlocked = 0, provBlack = 0;
    provider.dns.forEach(d => {
      d.channels.forEach(c => {
        provTotal++;
        if (c.status === 'online') provOnline++;
        if (c.status === 'blocked') provBlocked++;
        if (c.status === 'black') provBlack++;
      });
    });

    let badgeClass, badgeText;
    const provPct = provTotal > 0 ? provOnline / provTotal : 0;
    if (provPct >= 0.9) { badgeClass = 'badge-online'; badgeText = 'Operational'; }
    else if (provPct >= 0.5) { badgeClass = 'badge-degraded'; badgeText = 'Degraded'; }
    else if (provBlocked > 0 && provOnline === 0) { badgeClass = 'badge-blocked'; badgeText = 'CF Blocked'; }
    else { badgeClass = 'badge-down'; badgeText = 'Down'; }

    html += `<div class="provider-card">`;
    html += `
      <div class="provider-header">
        <div class="provider-name">${esc(provider.name)}</div>
        <span class="provider-badge ${badgeClass}">${badgeText}</span>
        <div class="spacer"></div>
        <span style="font-size:11px;color:var(--muted)">${provOnline}/${provTotal} streams OK</span>
      </div>
    `;

    // ── Per-DNS sections ──
    provider.dns.forEach(dns => {
      const dnsOnline = dns.channels.filter(c => c.status === 'online').length;
      const dnsTotal = dns.channels.length;

      // Auth status indicators
      let authIcon = '';
      if (dns.cloudflareBlocked) authIcon = '<span style="color:var(--red)" title="Cloudflare blocked">🛡️</span>';
      else if (!dns.dnsResolves) authIcon = '<span style="color:var(--red)" title="DNS failed">❌</span>';
      else if (!dns.authOk) authIcon = '<span style="color:var(--amber)" title="Auth failed">⚠️</span>';
      else authIcon = '<span style="color:var(--success)" title="Auth OK">✓</span>';

      html += `<div class="dns-section">`;
      html += `
        <div class="dns-header">
          ${authIcon}
          <span class="dns-host">${esc(dns.host)}</span>
          <span style="font-size:10px;color:var(--muted)">
            DNS: ${dns.dnsResolves ? '✓' : '✗'} · Auth: ${dns.authOk ? '✓' : '✗'}
          </span>
          <span style="font-size:10px;color:var(--muted);margin-left:auto">${dnsOnline}/${dnsTotal}</span>
        </div>
      `;

      if (dns.channels.length > 0) {
        html += '<div class="channel-grid">';
        dns.channels.forEach(ch => {
          const dotClass = {
            online: 'ch-dot-online', blocked: 'ch-dot-blocked',
            black: 'ch-dot-black', error: 'ch-dot-error',
          }[ch.status] || 'ch-dot-error';
          const statusLabel = {
            online: 'OK', blocked: 'Blocked', black: 'Black', error: 'Error',
          }[ch.status] || 'Error';

          html += `
            <div class="ch-cell" title="${esc(ch.detail || '')}">
              <div class="ch-dot ${dotClass}"></div>
              <span class="ch-name">${esc(ch.name)}</span>
              <span class="ch-status">${statusLabel}</span>
            </div>
          `;
        });
        html += '</div>';
      }

      html += '</div>'; // dns-section
    });

    // ── Uptime timeline from history ──
    const provHistory = getProviderHistory(provider.id, history.history || []);
    if (provHistory.length > 0) {
      html += `
        <div class="timeline-section">
          <div class="timeline-label">Last ${provHistory.length} hours</div>
          <div class="timeline">
      `;

      // Pad to HISTORY_HOURS slots
      const padded = padTimeline(provHistory, HISTORY_HOURS);
      padded.forEach(entry => {
        let barClass, tip;
        if (!entry) {
          barClass = 'timeline-bar-none';
          tip = 'No data';
        } else {
          const pct = entry.total > 0 ? entry.online / entry.total : 0;
          if (pct >= 0.9) { barClass = 'timeline-bar-ok'; tip = `${Math.round(pct*100)}% healthy`; }
          else if (pct >= 0.5) { barClass = 'timeline-bar-degraded'; tip = `${Math.round(pct*100)}% healthy`; }
          else { barClass = 'timeline-bar-down'; tip = `${Math.round(pct*100)}% healthy`; }
          if (entry.timestamp) {
            const d = new Date(entry.timestamp);
            tip += ` · ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
          }
        }
        html += `<div class="timeline-bar ${barClass}" data-tip="${esc(tip)}"></div>`;
      });

      html += `
          </div>
          <div class="timeline-meta">
            <span>${HISTORY_HOURS}h ago</span>
            <span>Now</span>
          </div>
        </div>
      `;
    }

    html += '</div>'; // provider-card
  });

  container.innerHTML = html;
}

// ─────────────────────────────────────────────
// Extract per-provider timeline from history
// ─────────────────────────────────────────────
function getProviderHistory(providerId, history) {
  return history.map(entry => {
    const prov = entry.providers.find(p => p.id === providerId);
    if (!prov) return null;
    let online = 0, blocked = 0, black = 0, error = 0, total = 0;
    prov.dns.forEach(d => {
      online += d.online || 0;
      blocked += d.blocked || 0;
      black += d.black || 0;
      error += d.error || 0;
      total += d.total || 0;
    });
    return { timestamp: entry.timestamp, online, blocked, black, error, total };
  }).filter(Boolean).reverse(); // oldest first for timeline
}

function padTimeline(data, slots) {
  if (data.length >= slots) return data.slice(-slots);
  const padding = new Array(slots - data.length).fill(null);
  return [...padding, ...data];
}

// ─────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────
function timeAgo(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ${mins % 60}m ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ─────────────────────────────────────────────
// Init + auto-refresh
// ─────────────────────────────────────────────
async function init() {
  try {
    const data = await fetchStatus();
    render(data);
  } catch (e) {
    console.error('Failed to fetch status:', e);
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">Connection Error</div>
        <div class="empty-desc">Could not fetch status data. Will retry automatically.</div>
      </div>
    `;
  }
}

init();
setInterval(init, REFRESH_INTERVAL);
</script>
</body>
</html>
